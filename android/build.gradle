// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Kotlin version for the native Orbbec plugin (kept in sync with
    // variables.gradle's kotlinVersion; the buildscript block runs before
    // variables.gradle is applied, so it can't reference rootProject.ext here).
    ext.kotlinVersion = '1.9.25'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'
        // Kotlin Gradle plugin — required because app/build.gradle applies
        // 'kotlin-android' for OrbbecPlugin.kt.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
