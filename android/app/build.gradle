apply plugin: 'com.android.application'
// Kotlin support for the native Orbbec plugin (OrbbecPlugin.kt). The
// kotlin-gradle-plugin classpath is declared in the root build.gradle.
apply plugin: 'kotlin-android'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String envName, String propertyName ->
    System.getenv(envName) ?: signingProperties.getProperty(propertyName)
}
def releaseKeystorePath = signingValue('PA_KEYSTORE', 'storeFile')
def releaseStorePassword = signingValue('PA_KEYSTORE_PASS', 'storePassword')
def releaseKeyAlias = signingValue('PA_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('PA_KEY_PASS', 'keyPassword')
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it }

def orbbecVendorAar = file('libs/obsensor_v2.0.6_2026031801_release.aar')
def slimOrbbecAar = layout.buildDirectory.file(
    'generated/orbbec/obsensor_v2.0.6_arm64_no_firmware_updater.aar'
)
def prepareSlimOrbbecAar = tasks.register('prepareSlimOrbbecAar', Zip) {
    from zipTree(orbbecVendorAar)
    exclude 'jni/armeabi-v7a/**'
    exclude 'assets/armeabi-v7a/**'
    exclude 'assets/arm64-v8a/extensions/firmwareupdater/**'
    archiveFileName = slimOrbbecAar.get().asFile.name
    destinationDirectory = slimOrbbecAar.get().asFile.parentFile
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def slimOrbbecFiles = files(slimOrbbecAar)
slimOrbbecFiles.builtBy(prepareSlimOrbbecAar)

android {
    namespace "dev.sawitulm.palmannotate"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.sawitulm.palmannotate"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        ndk {
            // All supported deployment devices use 64-bit ARM.
            abiFilters 'arm64-v8a'
        }
        versionCode = (System.getenv('PA_VERSION_CODE') ?: '1').toInteger()
        versionName = System.getenv('PA_VERSION_NAME') ?: '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Match the Java 17 target Capacitor sets in capacitor.build.gradle so the
    // Kotlin and Java compilers agree on the JVM bytecode level.
    kotlinOptions {
        jvmTarget = "17"
    }
}

gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any {
        it.name == 'assembleRelease' || it.name == 'bundleRelease'
    }
    if (buildsRelease && !releaseSigningConfigured) {
        throw new GradleException(
            'Release signing is not configured. Set PA_KEYSTORE, PA_KEYSTORE_PASS, ' +
            'PA_KEY_ALIAS, and PA_KEY_PASS, or create android/keystore.properties.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Kotlin standard library for the native Orbbec plugin (OrbbecPlugin.kt).
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlinVersion"

    // Generate an arm64-only SDK package and remove the unused camera firmware
    // updater. The original vendor AAR stays untouched for easy rollback.
    implementation slimOrbbecFiles

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Storage Access Framework folder writes for the user-chosen export folder
    // (SafPlugin.kt → DocumentFile tree traversal).
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
