name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PA_KEYSTORE: ${{ github.workspace }}/android/release.jks
      PA_KEYSTORE_PASS: ${{ secrets.PA_KEYSTORE_PASS }}
      PA_KEY_ALIAS: ${{ secrets.PA_KEY_ALIAS }}
      PA_KEY_PASS: ${{ secrets.PA_KEY_PASS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync web assets into Android
        run: npm run sync

      - name: Restore release keystore
        env:
          PA_KEYSTORE_BASE64: ${{ secrets.PA_KEYSTORE_BASE64 }}
        run: |
          test -n "$PA_KEYSTORE_BASE64"
          printf '%s' "$PA_KEYSTORE_BASE64" | base64 --decode > "$PA_KEYSTORE"

      - name: Build signed release APK
        env:
          PA_VERSION_NAME: ${{ github.ref_name }}
          PA_VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/release/app-release.apk "PalmAnnotate-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "PalmAnnotate-${GITHUB_REF_NAME}.apk" --verify-tag --generate-notes
